# 默认免费盯盘：约每 10 分钟跑一次。
# 注意：GitHub 定时任务最短约 5 分钟，而且经常会延迟，不是实时。
# 密钥请放在仓库 Settings → Secrets and variables → Actions：
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
name: Trading Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Run poll monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --config config.json --state .monitor-state.json

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
