# 默认免费盯盘。GitHub cron 在新仓库上经常数小时不触发，因此主调度已改到
# Cloudflare Worker Cron（每 10 分钟，状态存在 KV）。本工作流保留作备份，
# 与 Worker 共享同一份去重状态（MONITOR_SECRET + WORKER_URL）。
# 密钥：TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID、MONITOR_SECRET
# 非密钥变量：WORKER_URL
name: Trading Monitor

on:
  schedule:
    - cron: "6-59/10 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Run poll monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: python monitor.py --config config.json --state .monitor-state.json

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}
